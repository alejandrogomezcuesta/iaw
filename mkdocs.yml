site_name: Implantación y Aplicaciones Web
site_description: IAW - 2º ASIR
site_url: https://alejandrogomezcuesta.github.io/iaw/
repo_url: https://github.com/alejandrogomezcuesta/iaw
repo_name: alejandrogomezcuesta/iaw
site_dir: site
docs_dir: docs
strict: true

theme:
  name: material
  language: es
  features:
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select 
    - content.code.annotate
    - toc.follow
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro

plugins:
  - search:
      lang:
        - es

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.esm.min.mjs


# ---------------------------

nav:
  - Presentación de la asignatura: index.md
  - "RA 1 — Preparación del entorno de desarrollo":
      - "1 Apuntes: Acceso SSH con claves RSA en Debian": ra1/01-ssh-con-claves.md
      - "2 Práctica: Instalación de un Servidor Web LAMP en Debian": ra1/02-instalar-lamp-debian.md
      - "3 Resumen de Apache": ra1/03-resumen-apache.md
      - "4 Prácticas guiadas de Apache": ra1/04-practicas-apache.md
      - "5 Prácticas guiadas de MariaDB": ra1/05-practicas-mariadb.md
      - "6 Práctica: phpMyAdmin y aplicación web sencilla": ra1/06-phpmyadmin-app-sencilla.md
  - "RA 2 — Instalación de gestores de contenidos":
      - "1 Curso de docker": ra2/00-curso-docker.md
      - "2 Docker: Apache y Mariadb": ra2/01-docker-apache-y-mariadb.md
      - "3 Proxy inverso con apache": ra2/02-proxy-inverso-apache.md
      - "4 Simulacro de examen de docker": ra2/03-simulacro-examen-docker.md
  - "AWS - Guías":
      - "Ampliar el almacenamiento de una instancia de AWS": aws/ampliar-almacenamiento.md
